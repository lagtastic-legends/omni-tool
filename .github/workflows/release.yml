name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build Static Export for Mobile
        run: npm run build
        env:
          MOBILE_EXPORT: 1
          NEXT_TELEMETRY_DISABLED: 1

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Signed Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Stage Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/ZenoDeck-${{ github.ref_name }}-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ZenoDeck ${{ github.ref_name }}"
          body_path: RELEASE_NOTES_v3.0.0.md
          draft: false
          prerelease: false
          files: |
            dist/ZenoDeck-${{ github.ref_name }}-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
